<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>تسجيل الدخول - الرعدي أونلاين</title>
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo">
      <img src="design/logo.png" alt="رأس الصقر" />
      <span class="brand">الرعدي أونلاين</span>
    </div>
    <nav class="icons">
      <button onclick="location.href='index.html'">🏠</button>
    </nav>
  </header>

  <main class="container auth-page">
    <div class="auth-card">
      <h2>تسجيل الدخول</h2>
      <input id="email" type="email" placeholder="البريد الإلكتروني" />
      <input id="password" type="password" placeholder="كلمة المرور" />
      <button id="loginBtn" class="btn-primary" style="width:100%;margin-top:12px">دخول</button>
      <p class="muted" style="margin-top:12px">أو <a href="index.html">العودة للمتجر</a></p>
    </div>
  </main>

  <footer class="site-footer">
    <p>© كل الحقوق محفوظة - الرعدي أونلاين</p>
  </footer>

  <script>
    // منطق تسجيل دخول بسيط يعمل محلياً (لا حاجة لخادم الآن)
    (function(){
      const KEY_AUTH = 'raadi_auth_v1';

      function saveAuth(user){
        localStorage.setItem(KEY_AUTH, JSON.stringify(user));
      }
      function readAuth(){
        try{ return JSON.parse(localStorage.getItem(KEY_AUTH)||'null'); }catch(e){ return null; }
      }

      document.getElementById('loginBtn').onclick = function(){
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value.trim();
        if(!email || !password){ alert('الرجاء إدخال البريد الإلكتروني وكلمة المرور'); return; }
        // تحقق بسيط: إذا كانت كلمة المرور أقل من 4 أحرف نرفض
        if(password.length < 4){ alert('كلمة المرور قصيرة جداً'); return; }
        // إنشاء حساب وهمي وتخزينه
        const user = { email, name: email.split('@')[0], logged_at: new Date().toISOString() };
        saveAuth(user);
        alert('تم تسجيل الدخول بنجاح');
        location.href = 'account.html';
      };

      // إذا كان المستخدم مسجل بالفعل نعيد توجيهه
      const existing = readAuth();
      if(existing){ /* يمكنك إعادة التوجيه تلقائياً */ }
    })();
  </script>
</body>
</html>
